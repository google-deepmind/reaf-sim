# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: pypi

on:
  push:
    tags: "v*"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases
      id-token: write # Needed for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.12"
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "${TAG_NAME}" >/dev/null 2>&1 || \
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes "See the [changelog](https://reaf-sim.readthedocs.io/en/${TAG_NAME}/changelog.html)."

      - name: Build distributions
        run: uv build
      - name: Authenticate to Google Cloud (OSS Exit Gate)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/305452601764/locations/global/workloadIdentityPools/builders/providers/github'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Clean up failed staging attempt for this exact version (if any)
        id: exit_gate_cleanup
        run: |
          set -euo pipefail
          PKG_VER=$(python3 -c 'import email, glob, os, tarfile, zipfile; files = sorted(glob.glob("dist/*.whl") + glob.glob("dist/*.tar.gz")); assert files, "No distributions found in dist/"; p = files[0]; meta = (  zipfile.ZipFile(p).read([n for n in zipfile.ZipFile(p).namelist() if n.endswith(".dist-info/METADATA")][0])  if p.endswith(".whl") else   tarfile.open(p).extractfile([m for m in tarfile.open(p).getmembers() if m.name.endswith("/PKG-INFO") or m.name == "PKG-INFO"][0]).read()); print(email.message_from_bytes(meta)["Version"].strip())')
          echo "pkg_ver=${PKG_VER}" >> "$GITHUB_OUTPUT"
          set +e
          gcloud artifacts versions describe "${PKG_VER}" \
            --package="reaf-sim" \
            --project="oss-exit-gate-prod" \
            --location="us" \
            --repository="reaf-sim--pypi" \
            --format="value(name)" > /dev/null 2> describe.err
          DESC_RC=$?
          set -e
          if [ "$DESC_RC" -eq 0 ]; then
            echo "Deleting incomplete staged version ${PKG_VER} before retry..."
            gcloud artifacts versions delete "${PKG_VER}" \
              --package="reaf-sim" \
              --project="oss-exit-gate-prod" \
              --location="us" \
              --repository="reaf-sim--pypi" \
              --quiet
          elif grep -Eqi "NOT_FOUND|not.found|404" describe.err; then
            echo "Version ${PKG_VER} not present in staging repository — proceeding with fresh upload"
          else
            cat describe.err >&2
            exit "$DESC_RC"
          fi
      - name: Stage distributions to OSS Exit Gate and upload manifest
        env:
          PKG_VER: ${{ steps.exit_gate_cleanup.outputs.pkg_ver }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          uv pip install --system twine
          TWINE_PASSWORD="$(gcloud auth print-access-token)"
          python3 -m twine upload \
            --repository-url "https://us-python.pkg.dev/oss-exit-gate-prod/reaf-sim--pypi/" \
            -u oauth2accesstoken \
            -p "${TWINE_PASSWORD}" \
            dist/*
          cat <<EOF > manifest.json
          {
            "publish_all": false,
            "publishing_groups": [
              {
                "packages": [
                  {
                    "name": "reaf-sim",
                    "version": "${PKG_VER}"
                  }
                ]
              }
            ]
          }
          EOF
          gcloud storage cp manifest.json \
            "gs://oss-exit-gate-prod-projects-bucket/reaf-sim/pypi/manifests/manifest-${PKG_VER}-${RUN_ID}-${RUN_ATTEMPT}.json"
